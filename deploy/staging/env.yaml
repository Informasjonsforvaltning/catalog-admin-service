---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-admin-service
  labels:
    app: catalog-admin-service
spec:
  template:
    spec:
      containers:
        - name: catalog-admin-service
          env:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:+UseZGC -XX:MaxRAMPercentage=80.0"
          - name: POSTGRESQL_HOST
            valueFrom:
              secretKeyRef:
                name: postgres
                key: HOST
          - name: POSTGRESQL_PORT
            valueFrom:
              secretKeyRef:
                name: postgres
                key: PORT
          - name: POSTGRESQL_DB
            valueFrom:
              secretKeyRef:
                name: catalog-admin-service
                key: POSTGRESQL_DB
          - name: POSTGRESQL_USER
            valueFrom:
              secretKeyRef:
                name: catalog-admin-service
                key: POSTGRESQL_USER
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: catalog-admin-service
                key: POSTGRESQL_PASSWORD
          - name: KEYCLOAK_OIDC_ISSUER
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: KEYCLOAK_OIDC_ISSUER
          - name: CATALOG_ADMIN_SERVICE_URI
            valueFrom:
              secretKeyRef:
                name: commonurl
                key: CATALOG_ADMIN_SERVICE_BASE_URI
          - name: CORS_ORIGIN_PATTERNS
            value: https://*.staging.fellesdatakatalog.digdir.no,http://localhost:*
